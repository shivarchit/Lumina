name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-universal
            runner: macos-latest
            platform: darwin/universal
          - name: windows-amd64
            runner: windows-latest
            platform: windows/amd64
          - name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux webview deps
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: startsWith(matrix.platform, 'windows')
        run: choco install nsis --yes --no-progress

      - name: Test
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (macOS)
        if: startsWith(matrix.platform, 'darwin')
        run: |
          wails build -platform ${{ matrix.platform }} -clean -ldflags "-X main.appVersion=${{ github.ref_name }}"
          mkdir -p dist
          ditto -c -k --keepParent "build/bin/Lumina Desktop.app" "dist/Lumina-Desktop-${{ matrix.name }}.zip"

      - name: Build (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          # choco updates the machine PATH, but this step's shell predates it
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -platform ${{ matrix.platform }} -clean -ldflags "-X main.appVersion=${{ github.ref_name }}" -nsis
          mkdir -p dist
          cp "build/bin/Lumina Desktop-amd64-installer.exe" "dist/Lumina-Desktop-${{ matrix.name }}-installer.exe"
          cd build/bin && 7z a "../../dist/Lumina-Desktop-${{ matrix.name }}.zip" "Lumina Desktop.exe"

      - name: Build (Linux)
        if: startsWith(matrix.platform, 'linux')
        run: |
          # ubuntu-latest (24.04) ships webkit2gtk-4.1 only
          wails build -platform ${{ matrix.platform }} -clean -ldflags "-X main.appVersion=${{ github.ref_name }}" -tags webkit2_41
          mkdir -p dist staging
          cp "build/bin/Lumina Desktop" staging/lumina-desktop
          tar -C staging -czf "dist/Lumina-Desktop-${{ matrix.name }}.tar.gz" lumina-desktop

      - name: Compute SHA256
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.name }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.name }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build android-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mobile/go.mod

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cd mobile
          fyne package -os android
          mkdir -p ../dist
          cp Lumina.apk ../dist/Lumina-android.apk

      - name: Compute SHA256
        run: |
          cd dist
          sha256sum * > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten + combine checksums
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'SHA256SUMS-*' -exec cp {} release/ \;
          cat artifacts/**/SHA256SUMS-*.txt | sort > release/SHA256SUMS.txt
          ls -la release

      - name: Resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: release/*
