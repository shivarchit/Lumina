name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build universal macOS app
        run: wails build -platform darwin/universal -clean

      - name: Package
        run: |
          ditto -c -k --keepParent "build/bin/Lumina Desktop.app" Lumina-Desktop-mac-universal.zip
          shasum -a 256 Lumina-Desktop-mac-universal.zip > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Lumina-Desktop-mac-universal.zip checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
